spring.application.name=acme-salary-management

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/acme_salary_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate

security.jwt.secret=${JWT_SECRET:acme-salary-management-development-secret-key-2026}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

server.port=${PORT:8080}