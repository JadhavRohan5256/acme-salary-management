services:

  mysql:
    image: mysql:8.4
    container_name: acme-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

    networks:
      - acme-network


  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: acme-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

    networks:
      - acme-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: acme-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"

    networks:
      - acme-network

volumes:
  mysql_data:


networks:
  acme-network:
    driver: bridge