<mat-card class="update-salary-card">
    <mat-card-header>
        <mat-card-title>
            Update Salary
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="salaryForm" (ngSubmit)="submit()" class="salary-form">
            <div class="form-group">
                <mat-form-field appearance="outline">
                    <mat-label>New Salary</mat-label>
                    <input matInput type="number" formControlName="newSalary" min="0.01" />
                    <mat-error *ngIf="newSalaryControl?.hasError('required')">
                        Salary is required.
                    </mat-error>
                    <mat-error *ngIf="newSalaryControl?.hasError('min')">
                        Salary must be greater than 0.
                    </mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Currency</mat-label>
                    <mat-select formControlName="currencyId">
                        <mat-option *ngFor="let currency of currencies$ | async" [value]="currency.id">
                            {{ currency.code }} - {{ currency.name }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="currencyIdControl?.hasError('required')">
                        Currency is required.
                    </mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Effective Date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="effectiveDate" />
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                    <mat-error *ngIf="effectiveDateControl?.hasError('required')">
                        Effective date is required.
                    </mat-error>
                </mat-form-field>
            </div>
            <div *ngIf="error$ | async as error" class="error-message">
                {{ error }}
            </div>
            <div *ngIf="success$ | async" class="success-message">
                Salary updated successfully.
            </div>
            <div class="actions">
                <button mat-raised-button color="primary" type="submit" [disabled]="updating$ | async">
                    <mat-spinner *ngIf="updating$ | async" diameter="20"></mat-spinner>
                    <span *ngIf="!(updating$ | async)">
                        Update Salary
                    </span>
                </button>
                <button mat-stroked-button type="button" (click)="resetForm()" [disabled]="updating$ | async">
                    Reset
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
